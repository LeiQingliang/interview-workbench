name: 功能建议
description: 提出具体使用问题与改进方向
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        请描述使用场景与希望改善的体验，不要粘贴个人简历或真实客户资料。
        新功能需要兼顾离线使用、可访问性和本地数据边界。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 谁在什么场景下遇到了什么障碍？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进
      description: 描述行为和结果，不必先确定实现技术。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方式
      description: 可选。现有功能或其他简单做法为何不足？
  - type: textarea
    id: impact
    attributes:
      label: 边界与影响
      description: 是否涉及外部网络、导入内容、本地笔记、存储结构或第三方服务？
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 示例内容已匿名化，假设场景已明确标注。
          required: true
