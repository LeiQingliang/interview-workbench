name: 问题反馈
description: 报告界面、功能、内容或构建问题
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助改进。请只使用通用示例，删除截图和日志中的个人笔记、联系方式、客户信息及密钥。
        安全漏洞请先阅读 SECURITY.md，不要在公开 Issue 中发布利用细节。
  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 页面或交互
        - 本地笔记保存
        - 内容或计算错误
        - 无障碍或移动端
        - 安装、测试或构建
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明具体发生了什么，以及为什么影响使用。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 使用通用内容输入……
        3. 点击……
        4. 观察……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 使用环境
      description: 浏览器及版本、操作系统、在线或离线使用；构建问题可补充 Node.js 版本和提交编号。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
      description: 可选。请先确认没有个人笔记、令牌或真实业务资料。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我已检查正文与附件，不包含敏感资料或未经许可的个人信息。
          required: true
