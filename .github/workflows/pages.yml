name: Deploy tested Pages artifact

# This workflow has no independent push or manual trigger. CI calls it only
# after every matrix job passes, using the artifact from that same workflow run.
on:
  workflow_call:
    inputs:
      tested-sha:
        description: Exact source commit checked and built by the calling CI run
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify the tested commit belongs to this run
        env:
          TESTED_SHA: ${{ inputs.tested-sha }}
        run: test "$TESTED_SHA" = "$GITHUB_SHA"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the artifact produced by the successful CI run
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages
