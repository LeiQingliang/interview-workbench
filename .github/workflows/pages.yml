name: Deploy tested Pages artifact

# This workflow has no independent push or manual trigger. CI calls it only
# after every matrix job passes, using the artifact from that same workflow run.
on:
  workflow_call:
    inputs:
      tested-sha:
        description: Exact source commit checked and built by the calling CI run
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify the tested commit belongs to this run
        env:
          TESTED_SHA: ${{ inputs.tested-sha }}
        run: test "$TESTED_SHA" = "$GITHUB_SHA"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the artifact produced by the successful CI run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
